<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Kalam&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Same system as the landing page: ledger paper, file ink, pipeline green. The app is the working desk, so it stays quiet: white sheets, ruled lines, one green action per screen. */
:root{
  color-scheme:light;
  --paper:#F4F6F0; --sheet:#FFFFFF; --ink:#10261D; --muted:#4A5C53; --rule:#CBD5CD; --field:#F7F9F5;
  --green:#0E6A48; --green-dark:#0A5238; --band:#E6EEE7; --manila:#E6D7A6; --pencil:#B3261E;
  --mark:#FFE066; --warn-bg:#FFF4CC; --warn-ink:#5C4300;
  --display:"Archivo",Arial,sans-serif; --text:"Public Sans",Arial,sans-serif; --hand:"Kalam","Comic Sans MS",cursive;
  --shadow:5px 5px 0 rgba(16,38,29,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:30px;font-weight:800;font-stretch:96%}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700;font-family:var(--text)}
p{margin:0}
a{color:var(--green)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:4px 0}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;display:flex;gap:8px;align-items:center}
.brand small{font-family:var(--text);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);padding:1px 6px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet.narrow{max-width:460px;width:100%;margin:6vh auto 0}
.muted{color:var(--muted);font-size:14px}
.label{font-family:var(--display);font-weight:700;font-stretch:80%;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hand{font-family:var(--hand);color:var(--pencil);font-size:17px;line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
label{font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=url],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:2px;padding:11px 12px}
textarea{min-height:96px;resize:vertical}
textarea.big{min-height:150px}
select{width:auto;max-width:100%}
input.code{font-family:var(--display);font-size:26px;letter-spacing:.3em;text-align:center;max-width:220px}
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:10px 16px;border-radius:2px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.primary,.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
button.primary:hover{background:var(--green-dark)}
button.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:10px 8px}
button.danger{color:var(--pencil)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.notice{background:var(--warn-bg);color:var(--warn-ink);border:1px solid #E8D48A;padding:12px 14px;font-size:14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.coach{background:var(--band);border-left:3px solid var(--green);padding:10px 12px;font-size:14px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap;border:1.5px solid transparent;border-bottom:0;margin-bottom:-2px}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--sheet);border-color:var(--ink);border-bottom:2px solid var(--sheet)}
.seg{display:inline-flex;border:1.5px solid var(--ink)}
.seg button{border:0;border-radius:0;min-height:40px;background:var(--sheet);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border:1px solid var(--rule);white-space:nowrap;background:var(--sheet)}
.chip.s-Drafted,.chip.s-Approved{background:var(--band)}
.chip.s-Sent{border-color:var(--green)}
.chip.s-Replied{background:var(--mark);border-color:#E3C74F}
.chip.s-Callbooked,.chip.s-approved,.chip.s-active{background:var(--green);color:#fff;border-color:var(--green)}
.chip.s-Notafit,.chip.s-rejected{color:var(--muted);text-decoration:line-through}
.chip.s-pending{background:var(--warn-bg);border-color:#E8D48A}
.phead{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:0;min-height:44px}
.pname{font-weight:600}
.block{border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:10px}
.block.soft{background:var(--band);border-color:transparent}
.quote{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 88%,transparent 88%);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:2px solid var(--ink);border-left:1px solid var(--rule)}
.tile{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--sheet)}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
th{font-family:var(--display);font-stretch:80%;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.plan{border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.plan.main{border:2px solid var(--ink)}
.price{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.price small{font-family:var(--text);font-weight:400;font-size:15px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;min-height:36px}
.check input{width:20px;height:20px}
#busy{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 16px;display:none;gap:12px;align-items:center;justify-content:center;font-weight:600;z-index:5}
#busy.on{display:flex}
details.add>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
details.add>summary::before{content:"+";font-family:var(--display);font-weight:800;font-size:22px;color:var(--green)}
details.add[open]>summary::before{content:"\2212"}
details>summary{cursor:pointer;font-weight:600;color:var(--green);min-height:32px;display:flex;align-items:center}
details[open]>summary{margin-bottom:8px}
/* guided setup */
.progress{height:6px;background:var(--band);border:1px solid var(--rule)}
.progress span{display:block;height:100%;background:var(--green);transition:width .25s ease}
.wizard{gap:16px;padding:28px 24px}
h1.wiz{font-size:clamp(24px,4.4vw,32px);max-width:24ch}
.wizard textarea{min-height:110px}
#brain-dump{min-height:180px}
.badge{align-self:flex-start;margin:0;font-size:13px;font-weight:600;color:var(--green-dark);background:var(--band);border:1px dashed var(--green);padding:2px 8px}
button.ai{border-color:var(--green);color:var(--green-dark);background:var(--sheet)}
button.ai::before{content:"";width:9px;height:9px;margin-right:8px;background:var(--green);transform:rotate(45deg)}
.suggest{border:1.5px dashed var(--green);background:var(--band);padding:14px;display:flex;flex-direction:column;gap:10px}
.suggest .label{margin:0}
.suggest-text{margin:0;font-size:17px;line-height:1.45;background:var(--sheet);border-left:3px solid var(--green);padding:10px 12px}
.nudge{background:var(--warn-bg);color:var(--warn-ink);border-left:3px solid #C9A227;padding:10px 12px;font-size:14px}
.answers{display:flex;flex-direction:column}
.answer{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.answer:last-child{border-bottom:0}
.answer span{overflow-wrap:anywhere}
/* prospects */
.seg.wide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.wide button{padding:10px 6px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
.block.suggestion{background:var(--sheet)}
.score{font-family:var(--display);font-weight:800;font-size:14px;white-space:nowrap;padding:3px 9px;border:1.5px solid var(--green);color:var(--green-dark)}
input[type=file]{font:inherit;max-width:100%}
@media (min-width:640px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .plans{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){ .progress span{transition:none} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../">Client Pipeline <small>Early access</small></a>
    <div class="who" id="who"></div>
  </header>
  <div id="notice" aria-live="polite"></div>
  <main id="main"><div class="sheet"><p>Loading...</p></div></main>
</div>
<div id="busy" role="status"><span id="busyText">Working...</span></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
